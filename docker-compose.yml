services:
    postgres:
        # Pinned to a major: a new major cannot read the data directory of the
        # previous one, so an unpinned `postgres` breaks the volume on upgrade.
        image: postgres:18
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Volverjs!}
            POSTGRES_DB: ${POSTGRES_DB:-monorepo_starter}
            PGDATA: /data/postgres
        volumes:
            - postgres:/data/postgres
        ports:
            # Port taken by another project? `POSTGRES_PORT=<free port> docker compose
            # up -d postgres`, and the same port in DATABASE_URL (apps/backend/.env.local):
            # the integration tests follow it.
            - '${POSTGRES_PORT:-5432}:5432'
        networks:
            - postgres
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres}']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    pgadmin:
        image: dpage/pgadmin4
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@dpage.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-Volverjs!}
            PGADMIN_CONFIG_SERVER_MODE: 'False'
        volumes:
            - pgadmin:/var/lib/pgadmin
        ports:
            # Optional, and not started with `docker compose up -d postgres`
            - '${PGADMIN_PORT:-5050}:80'
        networks:
            - postgres
        restart: unless-stopped

networks:
    postgres:
        driver: bridge

volumes:
    postgres:
    pgadmin:
